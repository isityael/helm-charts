name: Release csi-s3 chart

on:
  push:
    branches:
      - main
    tags:
      - csi-s3-v*
    paths:
      - .github/workflows/release-csi-s3.yaml
      - charts/csi-s3/**

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mirrored tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package chart
        run: |
          helm repo add yandex-cloud https://yandex-cloud.github.io/k8s-csi-s3/charts
          helm dependency build charts/csi-s3
          helm lint charts/csi-s3 --values charts/csi-s3/ci/test-values.yaml
          helm package charts/csi-s3
          sha256sum csi-s3-*.tgz > csi-s3-chart.sha256

      - name: Publish chart to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push csi-s3-*.tgz oci://ghcr.io/isityael/charts

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          csi-s3-*.tgz
          csi-s3-chart.sha256
          --generate-notes
          --title "${GITHUB_REF_NAME}"
