repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.ci/rendered/
      - id: end-of-file-fixer
        exclude: ^\.ci/rendered/
      - id: check-yaml
        args: [ --allow-multiple-documents ]
        exclude: ^(apps/.*/templates/|charts/.*/templates/)
      - id: check-added-large-files
        exclude: ^charts/victoria-metrics-operator/charts/crds/crds/crd\.yaml$
      - id: check-added-large-files
        name: check vendored VictoriaMetrics CRD size
        # The upstream generated schema is about 2 MiB; retain a bounded size check.
        files: ^charts/victoria-metrics-operator/charts/crds/crds/crd\.yaml$
        args: [--maxkb=3072]
      - id: check-shebang-scripts-are-executable
        exclude: \.j2$
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-symlinks
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: ^\.ci/rendered/
        args:
          - -c
          - .yamllint.yml
        files: \.(yml|yaml)$

  - repo: local
    hooks:
      - id: csi-s3-contract
        name: validate CSI-S3 image metadata and rendered contract
        entry: bash .ci/tests/csi-s3-contract.sh
        language: system
        pass_filenames: false
        files: ^(charts/csi-s3/|\.ci/(renovate-helm-dependency-update\.mjs|tests/csi-s3-contract\.sh)$)

      - id: renovate-helm-auth
        name: test Renovate metadata synchronization against the chart schema
        entry: node --test .ci/tests/renovate-helm-dependency-update.mjs
        language: system
        pass_filenames: false
        files: ^(renovate\.json$|charts/csi-s3/|\.ci/(renovate-helm-dependency-update\.mjs|tests/renovate-helm-dependency-update\.mjs)$)

      - id: chart-version-bump
        name: bump owning chart version for packaged chart changes
        entry: .ci/chart-version-bump.sh
        language: system
        pass_filenames: false
        files: ^charts/[^/]+/

      - id: helm-lint
        name: helm lint (changed charts)
        entry: .ci/helm-lint.sh --staged
        language: system
        pass_filenames: false
        files: ^charts/

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 43.235.1
    hooks:
      - id: renovate-config-validator
        args: [ --strict ]
