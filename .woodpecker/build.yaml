# helm-charts — CI: lint changed charts on pushes and PRs, or all charts
# when the previous revision is unavailable (see .ci/changed-charts.sh).
# OCI publishing is handled by release-all.yaml; Forgejo Actions
# (.forgejo/workflows/release-tag.yaml) tags each published chart version.
when:
  - event: manual
  - event: pull_request
  - event: push
    branch: main

steps:
  - name: renovate-helm-auth
    image: dhi.io/node:26.12.1-alpine3.24-dev@sha256:0614d22bcdfe1f5fbf985e68b455e61aefba8bc697894a6e91a8542a3e5f26b4
    commands:
      - node --test .ci/tests/renovate-helm-dependency-update.mjs

  - name: chart-version-guard
    image: ghcr.io/isityael/chart-version-guard:a5263c4c@sha256:67427f5e9321deff52ad83cd67aea7dcdb092b34cff8c324db2a77e963d66ec2
    commands:
      - chart-version-guard check --ci woodpecker --repo .

  - name: repository-contracts
    image: harbor.m0sh1.cc/apps/k8s-lint-tools:ci-contract-955439a6-600@sha256:08ded45a856932cfaec69c72dc9efddc24fd97083a143131497ccf8998f06bf3
    commands:
      - apk add --no-cache deno jq perl perl-utils ripgrep
      - bash .ci/test-shell.sh

  - name: helm-lint-pr
    image: &helm dhi.io/helm:4.3.1-debian13-dev@sha256:8d77e0b84c3923b7823e562216ffe63574432ad298f4da23b30ae70485b46eec
    commands: &helm-lint
      - bash .ci/helm-lint.sh
    when:
      - event: pull_request

  # Same as helm-lint-pr, plus DHI credentials (not exposed to pull requests).
  - name: helm-lint
    image: *helm
    environment:
      DHI_USERNAME:
        from_secret: dhi_username
      DHI_PASSWORD:
        from_secret: dhi_password
    commands: *helm-lint
    when:
      - event: push
        branch: main

  # CRDs resolve from the datreeio catalog; kinds it lacks are skipped.
  - name: kubeconform
    image: ghcr.io/yannh/kubeconform:v0.8.0-alpine@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f
    commands:
      - |
        if ! ls .ci/rendered/*.yaml >/dev/null 2>&1; then echo "No rendered charts."; exit 0; fi
        schema='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main'
        /kubeconform -strict -summary -ignore-missing-schemas \
          -schema-location default \
          -schema-location "$schema/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
          .ci/rendered/*.yaml

  - name: kube-linter
    image: docker.io/stackrox/kube-linter:v0.8.3-alpine@sha256:b8311611c27032d4922bc67719225e373e4a0ab0c767bbdcf5f20a9306b1a3bb
    commands:
      - |
        if ! ls .ci/rendered/*.yaml >/dev/null 2>&1; then echo "No rendered charts."; exit 0; fi
        /kube-linter lint .ci/rendered --config .kube-linter.yaml
