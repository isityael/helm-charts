# helm-charts — CI: lint changed charts on pushes and PRs, or all charts
# when the previous revision is unavailable (see .ci/changed-charts.sh).
# OCI publishing is handled by release-all.yaml; Forgejo Actions
# (.forgejo/workflows/release-tag.yaml) tags each published chart version.
when:
  - event: manual
  - event: pull_request
  - event: push
    branch: main

steps:
  # Runs first, on a clean checkout, before helm-lint writes .ci/rendered.
  - name: gitleaks
    image: dhi.io/gitleaks:8.30.1-debian13-dev
    commands:
      - gitleaks detect --source . --no-git --config .gitleaks.toml

  - name: renovate-helm-auth
    image: dhi.io/node:26.13.1-alpine3.24-dev
    commands:
      - node --test .ci/tests/renovate-helm-dependency-update.mjs

  - name: chart-version-guard
    image: git.m0sh1.cc/isityael/chart-version-guard:v0.1.0-ym.24
    commands:
      - chart-version-guard check --ci woodpecker --repo .

  - name: repository-contracts
    # harbor.m0sh1.cc/apps/* is disabled for Renovate in the shared base preset
    # ("Ignore self-built images"), so the previous ci-contract-* pin could
    # never be updated. Track the released tag that infra also runs; jq and
    # python3 ship in the image, so only the genuinely absent tools are added.
    image: &lint-tools git.m0sh1.cc/isityael/k8s-lint-tools:v1.0.1749
    commands:
      - apk add --no-cache deno perl perl-utils ripgrep
      - bash .ci/test-shell.sh

  - name: helm-lint-pr
    image: &helm dhi.io/helm:4.3.2-debian13-dev
    commands: &helm-lint
      - bash .ci/helm-lint.sh
    when:
      - event: pull_request

  # Same as helm-lint-pr, plus DHI credentials (not exposed to pull requests).
  - name: helm-lint
    image: *helm
    environment:
      DHI_USERNAME:
        from_secret: dhi_username
      DHI_PASSWORD:
        from_secret: dhi_password
    commands: *helm-lint
    when:
      - event: push
        branch: main

  # CRDs resolve from the datreeio catalog; kinds it lacks are skipped.
  - name: kubeconform
    image: *lint-tools
    commands:
      - |
        if ! ls .ci/rendered/*.yaml >/dev/null 2>&1; then echo "No rendered charts."; exit 0; fi
        schema='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main'
        kubeconform -strict -summary -ignore-missing-schemas \
          -schema-location default \
          -schema-location "$schema/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
          .ci/rendered/*.yaml

  - name: kube-linter
    image: *lint-tools
    commands:
      - |
        if ! ls .ci/rendered/*.yaml >/dev/null 2>&1; then echo "No rendered charts."; exit 0; fi
        kube-linter lint .ci/rendered --config .kube-linter.yaml
