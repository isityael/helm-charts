# helm-charts — Publish charts to their configured OCI registries
#
# Triggered on push to main when charts/ change, or manually.
# KDED publishes privately to Forgejo; other chart destinations stay unchanged.
# Registry routing and existing-version checks live in .ci/publish-oci.sh.
#
# Script is in .ci/publish-oci.sh to avoid Woodpecker's ${VAR}
# pre-processing which strips shell-local variable expansions.
when:
  - event: manual
  - event: push
    branch: main
    path:
      include:
        - ".ci/install-oras.sh"
        - ".ci/publish-artifacthub-metadata.sh"
        - ".ci/publish-oci.sh"
        - ".woodpecker/build.yaml"
        - ".woodpecker/release-all.yaml"
        - "artifacthub-repo.yml"
        - "charts/**"

depends_on:
  - build

steps:
  - name: install-oras
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    commands:
      - ORAS_INSTALL_DIR=.ci/oras-bin sh .ci/install-oras.sh

  - name: publish-oci
    image: dhi.io/helm:4.3.0-debian13-dev@sha256:03f857edb2c9542f43e4fa5d84843864a99bd3685897e9a0d1bc4a1114aa9120
    environment:
      GHCR_USERNAME:
        from_secret: github_username
      GHCR_TOKEN:
        from_secret: github_token
      FORGEJO_PACKAGE_USERNAME:
        from_secret: forgejo_package_username
      FORGEJO_PACKAGE_TOKEN:
        from_secret: forgejo_package_token
      DHI_USERNAME:
        from_secret: dhi_username
      DHI_PASSWORD:
        from_secret: dhi_password
    commands:
      - bash .ci/publish-oci.sh
      - ORAS_BIN=.ci/oras-bin/oras bash .ci/publish-artifacthub-metadata.sh
