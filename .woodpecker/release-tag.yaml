# helm-charts - verify a Forgejo release tag against the existing OCI chart
#
# Tags must be <chart>-v<Chart.yaml version>. OCI publication remains owned by
# release-all.yaml; this pipeline only verifies and pulls the exact published
# version. The canonical release is the Forgejo tag plus the GHCR OCI artifact.
when:
  - event: tag
    ref: refs/tags/*-v*

steps:
  - name: pull-existing-oci
    image: dhi.io/helm:4.2.0-debian13-dev@sha256:2d3e501f60d564a46a37320c75e15e20481bd38d879066468e4daf5d48b4ebe2
    environment:
      GHCR_USERNAME:
        from_secret: github_username
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - bash .ci/release-tag.sh
