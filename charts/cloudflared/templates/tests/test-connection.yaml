{{- if and .Values.tests.enabled (or .Values.metrics.service.enabled .Values.metrics.serviceMonitor.enabled) }}
# Run with `helm test <release>`. Argo CD ignores Helm test hooks.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cloudflared.fullname" . }}-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudflared.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: {{ .Values.tests.image | quote }}
      command: [wget]
      args: [-q, -O, /dev/null, -T, "10", "http://{{ include "cloudflared.metricsServiceName" . }}:{{ .Values.metrics.service.port }}/ready"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
{{- end }}
