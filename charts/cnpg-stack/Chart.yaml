apiVersion: v2
name: cnpg-stack
description: CloudNativePG stack wrapper (operator, cluster, barman plugin, pooler, metrics)
type: application
icon: https://raw.githubusercontent.com/cloudnative-pg/artwork/main/cloudnativepg-logo.svg
version: 0.14.1
appVersion: "1.30.0"
kubeVersion: ">=1.29.0-0"
maintainers:
  - name: m0sh1
    email: yael@m0sh1.cc
keywords:
  - postgresql
  - cloudnative-pg
  - pgbouncer
  - barman
  - backup
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: Rebuild from the live cnpg-root/cnpg-home templates (zero rendered diff).
    - kind: added
      description: Pooler PDB, anti-affinity and topology spread; manual Backup; configurable scrapes.
    - kind: changed
      description: Database names map "_" to "-"; hash suffix only beyond 63 characters.
    - kind: fixed
      description: Render no operator Grafana dashboard when this chart is itself a dependency.
    - kind: changed
      description: Neutral operator and Cluster monitoring defaults; PgBouncer minPoolSize 0 and serverIdleTimeout 300.
dependencies:
  - name: cloudnative-pg-chart
    alias: cloudnative-pg
    version: 0.29.1
    repository: oci://dhi.io
  - name: plugin-barman-cloud
    version: 0.8.0
    repository: https://cloudnative-pg.github.io/charts
