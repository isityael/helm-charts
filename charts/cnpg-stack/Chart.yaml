apiVersion: v2
name: cnpg-stack
description: CloudNativePG stack wrapper (operator, cluster, barman plugin, pooler, metrics)
type: application
icon: https://raw.githubusercontent.com/cloudnative-pg/artwork/main/cloudnativepg-logo.svg
version: 0.15.1
appVersion: "1.30.0"
kubeVersion: ">=1.29.0-0"
maintainers:
  - name: m0sh1
    email: yael@m0sh1.cc
keywords:
  - postgresql
  - cloudnative-pg
  - pgbouncer
  - barman
  - backup
home: https://cloudnative-pg.io
sources:
  - https://github.com/cloudnative-pg/cloudnative-pg
  - https://github.com/cloudnative-pg/plugin-barman-cloud
  - https://git.m0sh1.cc/isityael/helm-charts/src/branch/main/charts/cnpg-stack
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: CloudNativePG
      url: https://cloudnative-pg.io
    - name: Barman Cloud plugin
      url: https://github.com/cloudnative-pg/plugin-barman-cloud
    - name: Chart source
      url: https://git.m0sh1.cc/isityael/helm-charts/src/branch/main/charts/cnpg-stack
  artifacthub.io/changes: |
    - kind: added
      description: Helm test pod running pg_isready against the primary and pooler (`cnpg.tests.enabled`).
    - kind: changed
      description: Add home, sources and Artifact Hub annotations.
dependencies:
  - name: cloudnative-pg-chart
    alias: cloudnative-pg
    version: 0.29.1
    repository: oci://dhi.io
  - name: plugin-barman-cloud
    version: 0.8.0
    repository: https://cloudnative-pg.github.io/charts
