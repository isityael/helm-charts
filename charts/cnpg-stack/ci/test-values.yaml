plugin-barman-cloud:
  commonAnnotations:
    ignore-check.kube-linter.io/readiness-port: >-
      Upstream chart 0.7.1 probes TCP port 8081 without declaring the informational containerPort.

cnpg:
  cluster:
    enabled: true
    name: cnpg-ci
    namespace: default
    instances: 1
    livenessProbeTimeout: 90
    storage:
      class: standard
      size: 1Gi
    walStorage:
      class: standard
      size: 1Gi
    backup:
      enabled: true
      immediate: true
      destinationPath: s3://cnpg-ci/
      endpointURL: http://minio.default.svc.cluster.local:9000
      manual:
        enabled: true
        name: cnpg-ci-backup-manual
    monitoring:
      enablePodMonitor: true
  roles:
    - name: ci_reader
      enabled: true
      login: true
    - name: ci_no_login
      enabled: true
      login: false
  databases:
    - name: ci_app
      enabled: true
      owner: ci_reader
  pgbouncer:
    enabled: true
    # Two replicas exercise the PodDisruptionBudget and anti-affinity paths.
    replicas: 2
    metrics:
      enabled: true
    affinity:
      enablePodAntiAffinity: true
      podAntiAffinityType: preferred
  metrics:
    releaseLabel: kube-prometheus-stack
    clusterScrape:
      name: cnpg-ci-cluster-metrics
