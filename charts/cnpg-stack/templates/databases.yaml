{{- $cnpg := .Values.cnpg | default dict -}}
{{- $cluster := $cnpg.cluster | default dict -}}
{{- $databases := $cnpg.databases | default list -}}
{{- if $cluster.enabled }}
{{- range $databases }}
{{- if or .enabled .ensure }}
{{- /* Sanitized name, e.g. mautrix_discord -> <cluster>-mautrix-discord.
       Names that overflow 63 chars get a hash suffix so truncation cannot
       make two Database resources collide. */ -}}
{{- $suffix := regexReplaceAll "[^a-z0-9-]+" (lower (toString .name)) "-" | trimAll "-" -}}
{{- $metadataName := printf "%s-%s" $cluster.name $suffix -}}
{{- if gt (len $metadataName) 63 -}}
{{- $metadataName = printf "%s-%s" ($metadataName | trunc 54 | trimSuffix "-") (sha256sum (toString .name) | trunc 8) -}}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $metadataName }}
  namespace: {{ $cluster.namespace }}
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/part-of: {{ $cluster.name }}
  {{- with $cnpg.databaseAnnotations }}
  annotations:
{{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  name: {{ .name | quote }}
  {{- if .ensure }}
  ensure: {{ .ensure | quote }}
  {{- end }}
  owner: {{ .owner | quote }}
  cluster:
    name: {{ $cluster.name | quote }}
  {{- if .databaseReclaimPolicy }}
  databaseReclaimPolicy: {{ .databaseReclaimPolicy | quote }}
  {{- end }}
  {{- if .extensions }}
  extensions:
{{ toYaml .extensions | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
