{{- $cnpg := .Values.cnpg | default dict -}}
{{- $cluster := $cnpg.cluster | default dict -}}
{{- $metrics := $cnpg.metrics | default dict -}}
{{- $scrapeKind := $metrics.scrapeKind | default "VMPodScrape" -}}
{{- $clusterScrape := $metrics.clusterScrape | default dict -}}
{{- if and $cluster.enabled (dig "enabled" true $clusterScrape) }}
{{- if eq $scrapeKind "PodMonitor" }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
{{- else }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
{{- end }}
metadata:
  name: {{ $clusterScrape.name | default (printf "%s-metrics" $cluster.name) }}
  namespace: {{ $metrics.namespace | default .Release.Namespace }}
  labels:
    app: kube-prometheus-stack
    release: {{ $metrics.releaseLabel | default "prometheus-agent" }}
spec:
  namespaceSelector:
    matchNames:
      - {{ $cluster.namespace }}
  selector:
    matchLabels:
      cnpg.io/cluster: {{ $cluster.name }}
      {{- if dig "instancesOnly" true $clusterScrape }}
      cnpg.io/podRole: instance
      {{- end }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
{{- end }}
