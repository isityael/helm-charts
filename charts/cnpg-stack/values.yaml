# CNPG operator dependency values
cloudnative-pg:
  imagePullSecrets: []
  # The operator chart ships its Grafana dashboard as a nested subchart
  # gated by this condition. Set it explicitly: when cnpg-stack is itself a
  # dependency (three chart levels), Helm cannot see the operator chart's own
  # default and would render the dashboard ConfigMap.
  monitoring:
    grafanaDashboard:
      create: false
  # Operator Deployment strategy is left at the upstream default; set e.g.
  # updateStrategy: {type: Recreate} to avoid two operators during rollouts.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Barman Cloud plugin dependency values
plugin-barman-cloud:
  image:
    registry: dhi.io
    repository: cloudnative-pg-plugin-barman-cloud
    tag: "0.15.0-debian13@sha256:89ba59e0c8a2c3ce2fb96128e6495c915f52d783074f304ca5fb3c9f724bbfa3"
  sidecarImage:
    registry: dhi.io
    repository: cloudnative-pg-plugin-barman-cloud-sidecar
    tag: "0.15.0-debian13@sha256:5f5bb297d2afb5a101e555e24017f525d88b1a6eeaaa942ef74689d50119ad5b"
  imagePullSecrets: []
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

cnpg:
  cluster:
    enabled: true
    name: cnpg-main
    namespace: apps
    instances: 1
    # CNPG-compatible wrapper around DHI Postgres Alpine with UID/GID 26 mapping.
    # CNPG admission rejects :latest tags for operand images.
    imageName: "ghcr.io/isityael/postgres-cnpg:18.4-alpine3.24-cnpg-dd386ee8@sha256:674301250f5d5c9c6a2923c53167f3817ec0607891a10f34b4d8d9a5c602f390"
    psqlImage: dhi.io/postgres:18.6-alpine3.24@sha256:c7a3bdacc95c194d9a83ea000f5fdfc40def1cd1900c1d905ce77a7568d07739
    enableSuperuserAccess: true
    imagePullSecrets: []
    # Optional Cluster settings, rendered only when set:
    # primaryUpdateStrategy: unsupervised
    # primaryUpdateMethod: switchover   # promote the updated standby on image updates
    # priorityClassName: ""
    # livenessProbeTimeout: 90          # seconds; failure threshold = ceil(value / 10)
    # annotations: {}
    # tolerations: []
    # affinity: {}                      # CNPG Cluster affinity (enablePodAntiAffinity, topologyKey, ...)
    # topologySpreadConstraints: []

    storage:
      class: local-path
      size: 20Gi

    walStorage:
      class: local-path
      size: 5Gi

    # CNPG's own generated PodMonitor (needs the Prometheus Operator CRDs).
    # Unset by default; cnpg.metrics.clusterScrape below covers most setups.
    # monitoring:
    #   enablePodMonitor: true

    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

    postgresql:
      parameters:
        max_connections: "200"
        shared_buffers: "256MB"
        effective_cache_size: "768MB"
        work_mem: "8MB"
        maintenance_work_mem: "64MB"
        max_wal_size: "1GB"
        min_wal_size: "256MB"
        wal_compression: "zstd"
        wal_level: "replica"
        random_page_cost: "1.1"
        effective_io_concurrency: "200"
        jit: "off"
        idle_in_transaction_session_timeout: "300000"
        idle_session_timeout: "600000"
        statement_timeout: "300000"

    backup:
      enabled: false
      schedule: "0 0 2 * * *"
      immediate: false
      objectStoreName: cnpg-backups
      # Required when enabled=true. Example: s3://root-cnpg-backups/
      destinationPath: ""
      # Required when enabled=true. Example: http://garage-root.apps.svc.cluster.local:3900
      endpointURL: ""
      s3Credentials:
        accessKeyId:
          name: cnpg-backups
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backups
          key: ACCESS_SECRET_KEY
      retentionPolicy: "30d"
      target: primary
      wal:
        compression: snappy
        maxParallel: 2
      data:
        compression: snappy
        jobs: 1
      instanceSidecarConfiguration:
        enabled: true
        retentionPolicyIntervalSeconds: 1800
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        env:
          - name: AWS_DEFAULT_REGION
            value: us-east-1
      # One-off Backup CR (GitOps-triggered). Disable after the run completes.
      manual:
        enabled: false
        # name: <cluster>-backup-manual

  roles: []

  databases: []

  databaseAnnotations: {}

  # Helm test pod (`helm test <release>`): pg_isready against the primary and
  # pooler, using the operand image. Argo CD ignores test hooks.
  tests:
    enabled: true

  pgbouncer:
    enabled: true
    replicas: 1
    # CNPG Pooler manager needs /usr/bin/pgbouncer. The image below is
    # intended to keep DHI content while adding that compatibility path.
    image: "ghcr.io/isityael/pgbouncer-cnpg:1.25.2-cnpg-a1a383f9@sha256:c5d0d00eca1918012df6fdd728a6d52ef4364910e8b60093d13419a962f62f3b"
    poolMode: transaction
    maxClientConn: 1000
    defaultPoolSize: 20
    # Keep 0: a non-zero floor makes PgBouncer hold idle backends until
    # PostgreSQL's idle_session_timeout terminates them.
    minPoolSize: 0
    reservePoolSize: 5
    maxDbConnections: 50
    serverLifetime: 3600
    # Keep below PostgreSQL's idle_session_timeout so PgBouncer closes
    # server sockets first.
    serverIdleTimeout: 300
    # Bump to force a pooler rollout (e.g. to refresh the auth cache after
    # credential rotation).
    rolloutNonce: ""
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    metrics:
      enabled: true
      interval: 30s
    # PodDisruptionBudget (maxUnavailable: 1), only rendered when replicas > 1.
    pdb:
      enabled: true
    # Pod anti-affinity between pooler pods:
    # affinity:
    #   enablePodAntiAffinity: true
    #   podAntiAffinityType: required   # or preferred
    #   topologyKey: kubernetes.io/hostname
    affinity: {}
    topologySpreadConstraints: []

  # Scrape objects for the cluster and pooler exporters.
  metrics:
    # VMPodScrape (VictoriaMetrics operator) or PodMonitor (Prometheus operator).
    scrapeKind: VMPodScrape
    # Namespace for the scrape objects; defaults to the release namespace.
    namespace: ""
    releaseLabel: prometheus-agent
    clusterScrape:
      enabled: true
      # Defaults to <cluster>-metrics.
      name: ""
      # Select only instance pods (cnpg.io/podRole=instance).
      instancesOnly: true
