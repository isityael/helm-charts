upstream:
  enabled: false

  images:
    # renovate: datasource=docker depName=cr.yandex/crp9ftr22d26age3hulg/yandex-cloud/csi-s3/csi-node-driver-registrar
    registrar: cr.yandex/crp9ftr22d26age3hulg/yandex-cloud/csi-s3/csi-node-driver-registrar:v2.16.0
    # renovate: datasource=docker depName=cr.yandex/crp9ftr22d26age3hulg/yandex-cloud/csi-s3/csi-provisioner
    provisioner: cr.yandex/crp9ftr22d26age3hulg/yandex-cloud/csi-s3/csi-provisioner:v6.2.0
    csi: cr.yandex/crp9ftr22d26age3hulg/yandex-cloud/csi-s3/csi-s3-driver:0.43.7

  secret:
    create: false
    name: csi-s3-secret
    accessKey: ""
    secretKey: ""
    endpoint: https://storage.yandexcloud.net
    region: ""

  storageClass:
    create: false

  tolerations:
    all: false
    node: []
    controller: []

  nodeSelector: {}
  kubeletPath: /var/lib/kubelet

  resources:
    nodeRegistrar:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 384Mi
    nodeDriver:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 768Mi
    controllerProvisioner:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 384Mi
    controllerDriver:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 768Mi

storageClasses: []

maintainedImage:
  repository: git.m0sh1.cc/isityael/csi-s3-driver
  # renovate: datasource=docker depName=git.m0sh1.cc/isityael/csi-s3-driver
  tag: v0.43.9-yael.13
  digest: ""
