# Enable only after publishing and verifying an immutable application image.
enabled: false
image:
  spec: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
replicaCount: 1
revisionHistoryLimit: 2
browser:
  # Provision first; integrate only after runtime sandbox and egress proof.
  enabled: false
  apiIntegration: false
  image: "selenium/standalone-firefox:4.51.0-20261010"
  publicOrigin: ""
  podAnnotations: {}
  persistence:
    storageClass: ""
    size: 2Gi
  # Observe and approve exact static-resource names before extending this list.
  egressHosts: [macked.app, appstorrent.ru, challenges.cloudflare.com]
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 3Gi
  proxyResources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
service:
  port: 8080
postgres:
  host: cnpg-main-rw.apps.svc.cluster.local
  port: 5432
  database: kded_catalog
  existingSecret: kded-catalog-postgres-auth
  caSecret: cnpg-main-ca
auth:
  existingSecret: kded-catalog-api-auth
worker:
  concurrency: 4
  sourceConcurrency: 1
  sourceIntervalSeconds: 2
tailscale:
  enabled: false
  hostname: kded-catalog
  proxyClass: ts-standalone-ingress
networkPolicy:
  enabled: true
  # Exact source names only; matchPattern wildcards are deliberately unsupported.
  sourceHosts: [macked.app, appstorrent.ru]
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Optional private, restricted Macked-only stateless solver bridge.
flareSolverr:
  url: ""
