apiVersion: v2
name: m0sh1-exporter
description: Network exporters bundle for OPNsense, SNMP, and Proxmox VE
type: application
version: 0.2.0
appVersion: "0.0.15-m0sh1.3"
kubeVersion: ">=1.28.0-0"
icon: https://opnsense.org/wp-content/themes/flavor/assets/images/opnsense.png
home: https://git.m0sh1.cc/isityael/helm-charts/src/branch/main/charts/m0sh1-exporter
sources:
  - https://github.com/AthennaMind/opnsense-exporter
  - https://github.com/prometheus/snmp_exporter
  - https://github.com/prometheus-pve/prometheus-pve-exporter
maintainers:
  - name: m0sh1
    email: yael@m0sh1.cc
keywords:
  - monitoring
  - opnsense
  - snmp
  - proxmox
  - prometheus
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: OPNsense exporter
      url: https://github.com/AthennaMind/opnsense-exporter
    - name: SNMP exporter
      url: https://github.com/prometheus/snmp_exporter
    - name: PVE exporter
      url: https://github.com/prometheus-pve/prometheus-pve-exporter
    - name: Chart source
      url: https://git.m0sh1.cc/isityael/helm-charts/src/branch/main/charts/m0sh1-exporter
  artifacthub.io/changes: |
    - kind: added
      description: Helm test pod fetching the OPNsense exporter /metrics (`tests.enabled`).
    - kind: changed
      description: Add Artifact Hub license and links annotations.
    - kind: changed
      description: README gains a Configuration section.
dependencies:
  - name: prometheus-snmp-exporter
    alias: snmpExporter
    version: 9.18.1
    repository: https://prometheus-community.github.io/helm-charts
  - name: prometheus-pve-exporter
    alias: pveexporter
    version: 2.10.0
    repository: https://charts.christianhuth.de
