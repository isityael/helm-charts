# Matrix umbrella chart default values.
#
# Defaults are DHI-first where this chart can safely use generic runtime images.
# Matrix-specific images without compatible DHI replacements intentionally remain
# on upstream registries and are exposed here so Renovate can track them.

matrixUmbrella:
  # Default policy for this chart. The value is documentation and validation
  # surface for consumers; subcharts use their own image value structures.
  imageProfile: dhi
  imagePullSecrets: []
  dhi:
    registry: dhi.io

tags:
  cinny: true
  mautrix-discord: false
  mautrix-signal: false
  mautrix-telegram: false
  mautrix-whatsapp: false
  matrix-appservice-irc: false

serverName: example.com
homeserverUrl: https://matrix.example.com

ess:
  serverName: example.com

  image:
    pullSecrets: []

  matrixTools:
    image:
      registry: ghcr.io
      repository: element-hq/ess-helm/matrix-tools
      tag: "0.10.2"
      digest: sha256:05760e89efd03f0bf20ac051ecccd14b60dbac5e4abd8a96d0d7e9979234abdd
      pullSecrets: []

  # Production default: use an external PostgreSQL service.
  postgres:
    enabled: false
    image:
      registry: dhi.io
      repository: postgres
      tag: "18.6-alpine3.24"
      digest: sha256:c7a3bdacc95c194d9a83ea000f5fdfc40def1cd1900c1d905ce77a7568d07739

  # Production default: use an external Redis-compatible service, preferably Valkey.
  redis:
    image:
      registry: dhi.io
      repository: valkey
      tag: "9.1.2-debian13"
      digest: sha256:57e7b695ba75857fc3e47572cd764671b7a182c400638d722cf5211f6a1b868b

  storage:
    resourcePolicy: keep

  ingress:
    tlsEnabled: true

  haproxy:
    image:
      registry: dhi.io
      repository: haproxy
      tag: "3.4.4-debian13"
      digest: sha256:9a1d0263e0f53d85341e284d7fcd3a4870dc80644515af0fb54444cd1c6adbe7

  elementWeb:
    enabled: true
    image:
      registry: oci.element.io
      repository: element-web
      tag: "v1.12.28"
      digest: sha256:a8f415462ab8d2600a592ba1b92bea51efe5a4d10eb738aab9bed769f7099613
    ingress:
      host: element.example.com

  elementAdmin:
    enabled: false

  matrixAuthenticationService:
    enabled: true
    image:
      registry: ghcr.io
      repository: element-hq/matrix-authentication-service
      tag: "1.24.0"
      digest: sha256:52c18ffcc940220a3b6aa5985b7e09d24ac27f5ed10a4d660c312e48f73ff105
    ingress:
      host: account.example.com
    postgres:
      host: postgres.example.svc.cluster.local
      port: 5432
      user: mas
      database: mas
      sslMode: prefer
      password:
        secret: matrix-postgres-auth
        secretKey: mas-password
    additional: {}

  synapse:
    enabled: true
    image:
      registry: oci.element.io
      repository: synapse
      tag: "v1.161.0"
      digest: sha256:6b95dd129e35e97e8032cb759e5db4a516a5f7ef6c98d34d716fea1ae239b62a
    ingress:
      host: matrix.example.com
    postgres:
      host: postgres.example.svc.cluster.local
      port: 5432
      user: synapse
      database: synapse
      sslMode: prefer
      password:
        secret: matrix-postgres-auth
        secretKey: synapse-password
    redis:
      host: valkey.example.svc.cluster.local
      port: 6379
      db: 0
      tls: false
    media:
      storage:
        size: 10Gi
    appservices: []
    additional:
      00-registration:
        config: |
          enable_registration: false

  wellKnownDelegation:
    enabled: true
    baseDomainRedirect:
      enabled: true
      url: https://element.example.com
    additional:
      client: |
        {"m.homeserver":{"base_url":"https://matrix.example.com"}}
      server: |
        {"m.server":"matrix.example.com:443"}
      support: "{}"

  matrixRTC:
    enabled: false

cinny:
  fullnameOverride: matrix-cinny
  image:
    registry: ghcr.io
    repository: cinnyapp/cinny
    tag: "v4.12.7"
    digest: sha256:83de4bd62b0684c536afd1af22f8eb11216f0ae52209e170b56cdae02498a97f
    pullPolicy: IfNotPresent
  config:
    defaultHomeserver: 0
    homeserverList:
      - "example.com"
    allowCustomHomeservers: true
    featuredCommunities:
      openAsDefault: false
      spaces: []
      rooms: []
      servers: []
  ingress:
    enabled: false

mautrix-discord:
  fullnameOverride: matrix-mautrix-discord
  podSecurityContext:
    fsGroup: 1337
    runAsGroup: 1337
    runAsNonRoot: true
    runAsUser: 1337
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  existingSecret:
    name: ""
    configKey: config.yaml
    registrationKey: registration.yaml
  image:
    registry: dock.mau.dev
    repository: mautrix/discord
    tag: "v0.7.7"
    digest: sha256:065405ca2f961b2687ca577c4eb65592c139d641342a9611d98b5394f30cf84a
    pullPolicy: IfNotPresent
  command:
    - /usr/bin/mautrix-discord
  config:
    homeserver:
      address: http://ess-synapse:8008
      domain: example.com
    appservice:
      address: http://matrix-mautrix-discord:29328
      id: discord
      bot:
        username: discordbot
    database:
      type: postgres
      uri: postgres://mautrix_discord:change-me@postgres.example.svc.cluster.local:5432/mautrix_discord?sslmode=prefer
    bridge:
      permissions:
        "example.com": user

