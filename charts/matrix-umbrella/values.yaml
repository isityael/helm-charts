# Matrix umbrella chart default values.
#
# Defaults are DHI-first where this chart can safely use generic runtime images.
# Matrix-specific images without compatible DHI replacements intentionally remain
# on upstream registries and are exposed here so Renovate can track them.

matrixUmbrella:
  # Default policy for this chart. The value is documentation and validation
  # surface for consumers; subcharts use their own image value structures.
  imageProfile: dhi
  imagePullSecrets: []
  dhi:
    registry: dhi.io

tags:
  cinny: true
  mautrix-discord: false
  mautrix-signal: false
  mautrix-telegram: false
  mautrix-whatsapp: false
  matrix-appservice-irc: false

serverName: example.com
homeserverUrl: https://matrix.example.com

ess:
  serverName: example.com

  image:
    pullSecrets: []

  matrixTools:
    image:
      registry: ghcr.io
      repository: element-hq/ess-helm/matrix-tools
      tag: "0.8.1"
      digest: sha256:c41cd3592938ac760d0aa49ff3e09684335137ce9fefa2cdbd2fde41c1503763
      pullSecrets: []

  # Production default: use an external PostgreSQL service.
  postgres:
    enabled: false
    image:
      registry: dhi.io
      repository: postgres
      tag: "18.6-alpine3.24"
      digest: sha256:d23585213fe835f109c6c74e68679c9c96fe6d3debe569b6c0fc89dc7f2977d0

  # Production default: use an external Redis-compatible service, preferably Valkey.
  redis:
    image:
      registry: dhi.io
      repository: valkey
      tag: "9.1.2-debian13"
      digest: sha256:c4380366bb92cca5d091205ea63b1115d2797bc21870ada7591085a0fc6a9dd2

  storage:
    resourcePolicy: keep

  ingress:
    tlsEnabled: true

  haproxy:
    image:
      registry: dhi.io
      repository: haproxy
      tag: "3.4.4-debian13"
      digest: sha256:07ff8af7d6653388ebbb22a503144e393504f99fdc54c19dcbdd379b2215946a

  elementWeb:
    enabled: true
    image:
      registry: oci.element.io
      repository: element-web
      tag: "v1.12.26"
      digest: sha256:a9be04cef41ed94cba0dcaeca5a81f89826d4f8be3d57ba5a6fa988f34eda703
    ingress:
      host: element.example.com

  elementAdmin:
    enabled: false

  matrixAuthenticationService:
    enabled: true
    image:
      registry: ghcr.io
      repository: element-hq/matrix-authentication-service
      tag: "1.23.0"
      digest: sha256:e82b2e4a5f9c7ca74096743349160795f5b5a792556fb85c6b5166a9180a5985
    ingress:
      host: account.example.com
    postgres:
      host: postgres.example.svc.cluster.local
      port: 5432
      user: mas
      database: mas
      sslMode: prefer
      password:
        secret: matrix-postgres-auth
        secretKey: mas-password
    additional: {}

  synapse:
    enabled: true
    image:
      registry: oci.element.io
      repository: synapse
      tag: "v1.159.0"
      digest: sha256:edf259d2b575b669a3e81024918ab8d5cfb7d2fba5a53c9e09695f1abc5645cb
    ingress:
      host: matrix.example.com
    postgres:
      host: postgres.example.svc.cluster.local
      port: 5432
      user: synapse
      database: synapse
      sslMode: prefer
      password:
        secret: matrix-postgres-auth
        secretKey: synapse-password
    redis:
      host: valkey.example.svc.cluster.local
      port: 6379
      db: 0
      tls: false
    media:
      storage:
        size: 10Gi
    appservices: []
    additional:
      00-registration:
        config: |
          enable_registration: false

  wellKnownDelegation:
    enabled: true
    baseDomainRedirect:
      enabled: true
      url: https://element.example.com
    additional:
      client: |
        {"m.homeserver":{"base_url":"https://matrix.example.com"}}
      server: |
        {"m.server":"matrix.example.com:443"}
      support: "{}"

  matrixRTC:
    enabled: false

cinny:
  fullnameOverride: matrix-cinny
  image:
    registry: ghcr.io
    repository: cinnyapp/cinny
    tag: "v4.12.6"
    digest: sha256:a7805a8a60ff621d343c128dbca6ba42ac5383ed5292522fd72248a77b9c836f
    pullPolicy: IfNotPresent
  config:
    defaultHomeserver: 0
    homeserverList:
      - "example.com"
    allowCustomHomeservers: true
    featuredCommunities:
      openAsDefault: false
      spaces: []
      rooms: []
      servers: []
  ingress:
    enabled: false

mautrix-discord:
  fullnameOverride: matrix-mautrix-discord
  podSecurityContext:
    fsGroup: 1337
    runAsGroup: 1337
    runAsNonRoot: true
    runAsUser: 1337
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  existingSecret:
    name: ""
    configKey: config.yaml
    registrationKey: registration.yaml
  image:
    registry: dock.mau.dev
    repository: mautrix/discord
    tag: "v0.7.7"
    digest: sha256:065405ca2f961b2687ca577c4eb65592c139d641342a9611d98b5394f30cf84a
    pullPolicy: IfNotPresent
  command:
    - /usr/bin/mautrix-discord
  config:
    homeserver:
      address: http://ess-synapse:8008
      domain: example.com
    appservice:
      address: http://matrix-mautrix-discord:29328
      id: discord
      bot:
        username: discordbot
    database:
      type: postgres
      uri: postgres://mautrix_discord:change-me@postgres.example.svc.cluster.local:5432/mautrix_discord?sslmode=prefer
    bridge:
      permissions:
        "example.com": user

