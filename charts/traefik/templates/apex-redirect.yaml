{{- with .Values.apexRedirect }}
{{- if .enabled }}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name | default "apex-redirect" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: apex-redirect
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: {{ $.Release.Namespace }}
      sectionName: websecure
  hostnames:
    {{- required "hostnames are required when apex resources are enabled" .hostnames | toYaml | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: {{ required "apexRedirect.hostname is required" .hostname | quote }}
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 301
{{- end }}
{{- end }}
