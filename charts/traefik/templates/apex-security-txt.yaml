{{- with .Values.securityTxt }}
{{- if .enabled }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apex-security-txt
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: apex-security-txt
    app.kubernetes.io/component: apex-static
data:
  Caddyfile: |
    {{- include "traefik.securityTxtCaddyfile" $ | nindent 4 }}
  security.txt: |
    {{- required "securityTxt.content is required" .content | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-security-txt
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: apex-security-txt
    app.kubernetes.io/component: apex-static
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apex-security-txt
  template:
    metadata:
      annotations:
        checksum/content: {{ printf "%s:%s" (include "traefik.securityTxtCaddyfile" $) .content | sha256sum }}
      labels:
        app.kubernetes.io/name: apex-security-txt
        app.kubernetes.io/component: apex-static
    spec:
      automountServiceAccountToken: false
      {{- with ($.Values.traefik.deployment).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: {{ $.Values.securityTxt.image | quote }}
          imagePullPolicy: IfNotPresent
          args: [run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /.well-known/security.txt
              port: 8080
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /.well-known/security.txt
              port: 8080
            periodSeconds: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: content
              mountPath: /usr/share/caddy/.well-known/security.txt
              subPath: security.txt
              readOnly: true
            - name: content
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: apex-security-txt
---
apiVersion: v1
kind: Service
metadata:
  name: apex-security-txt
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: apex-security-txt
    app.kubernetes.io/component: apex-static
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: apex-security-txt
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
# Gateway API HTTPRoute: /.well-known/ path is more specific than the
# apex-redirect's / catch-all, so it naturally wins without explicit priority.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apex-security-txt
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: apex-security-txt
    app.kubernetes.io/component: apex-static
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: {{ $.Release.Namespace }}
      sectionName: websecure
  hostnames:
    {{- required "hostnames are required when apex resources are enabled" .hostnames | toYaml | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/
      backendRefs:
        - group: ""
          kind: Service
          name: apex-security-txt
          port: 80
          weight: 1
{{- end }}
{{- end }}
