apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-app-with-custom-values
  namespace: argocd
spec:
  project: default

  source:
    repoURL: 'https://git.m0sh1.cc/isityael/helm-charts'
    path: charts/wakapi-dhi
    targetRevision: main

    helm:
      # Use default values.yaml plus custom overrides
      valueFiles:
        - values.yaml
      values: |
        ingress:
          className: traefik
          hosts:
            - host: wakapi.example.com
              paths:
                - path: /
                  pathType: Prefix
        config:
          db:
            host: postgres.example.com
            user: wakapi
            name: wakapi
        existingSecrets:
          dbPassword:
            secretName: wakapi-secrets
            key: db-password
          passwordSalt:
            secretName: wakapi-secrets
            key: password-salt
          cookieKey:
            secretName: wakapi-secrets
            key: cookie-key

      # Override specific values using parameters
      parameters:
        - name: replicaCount
          value: "3"
        - name: service.type
          value: "LoadBalancer"
        - name: ingress.enabled
          value: "true"
        - name: autoscaling.enabled
          value: "true"
        - name: autoscaling.minReplicas
          value: "2"
        - name: autoscaling.maxReplicas
          value: "10"

      # Additional overrides can also be provided inline
      # values: |
      #   replicaCount: 3
      #   service:
      #     type: LoadBalancer
      #   ingress:
      #     enabled: true
      #     className: nginx
      #     hosts:
      #       - host: example.local
      #         paths:
      #           - path: /
      #             pathType: Prefix
      #   autoscaling:
      #     enabled: true
      #     minReplicas: 2
      #     maxReplicas: 10

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
