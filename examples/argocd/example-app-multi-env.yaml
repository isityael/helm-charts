# This file demonstrates deploying the same chart to multiple environments
# with different configurations.

---
# Development Environment Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-app-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: 'https://git.m0sh1.cc/isityael/helm-charts'
    path: charts/wakapi-dhi
    targetRevision: main

    helm:
      valueFiles:
        - values.yaml
      values: |
        config:
          db:
            host: postgres.example.com
            user: wakapi
            name: wakapi
        existingSecrets:
          dbPassword:
            secretName: wakapi-secrets
            key: db-password
          passwordSalt:
            secretName: wakapi-secrets
            key: password-salt
          cookieKey:
            secretName: wakapi-secrets
            key: cookie-key
      parameters:
        - name: replicaCount
          value: "1"
        - name: resources.requests.memory
          value: "128Mi"
        - name: resources.requests.cpu
          value: "100m"

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
# Staging Environment Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-app-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: 'https://git.m0sh1.cc/isityael/helm-charts'
    path: charts/wakapi-dhi
    targetRevision: main

    helm:
      valueFiles:
        - values.yaml
      values: |
        config:
          db:
            host: postgres.example.com
            user: wakapi
            name: wakapi
        existingSecrets:
          dbPassword:
            secretName: wakapi-secrets
            key: db-password
          passwordSalt:
            secretName: wakapi-secrets
            key: password-salt
          cookieKey:
            secretName: wakapi-secrets
            key: cookie-key
      parameters:
        - name: replicaCount
          value: "2"
        - name: resources.requests.memory
          value: "256Mi"
        - name: resources.requests.cpu
          value: "200m"

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: false  # Disable automatic correction of live drift
    syncOptions:
      - CreateNamespace=true

---
# Production Environment Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-app-production
  namespace: argocd
spec:
  project: default

  source:
    repoURL: 'https://git.m0sh1.cc/isityael/helm-charts'
    path: charts/wakapi-dhi
    targetRevision: main

    helm:
      valueFiles:
        - values.yaml
      values: |
        config:
          db:
            host: postgres.example.com
            user: wakapi
            name: wakapi
        existingSecrets:
          dbPassword:
            secretName: wakapi-secrets
            key: db-password
          passwordSalt:
            secretName: wakapi-secrets
            key: password-salt
          cookieKey:
            secretName: wakapi-secrets
            key: cookie-key
      parameters:
        - name: replicaCount
          value: "3"
        - name: autoscaling.enabled
          value: "true"
        - name: autoscaling.minReplicas
          value: "3"
        - name: autoscaling.maxReplicas
          value: "10"
        - name: resources.requests.memory
          value: "512Mi"
        - name: resources.requests.cpu
          value: "500m"
        - name: resources.limits.memory
          value: "1Gi"
        - name: resources.limits.cpu
          value: "1000m"

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: false  # Never auto-prune in production
      selfHeal: false  # Disable automatic correction of live drift
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
