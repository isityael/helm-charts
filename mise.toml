# Mise configuration for m0sh1.cc/helm-charts
min_version = "2026.8.9"

[settings]
auto_install           = true
not_found_auto_install = true
task.run_auto_install  = true

[settings.status]
show_tools = true
show_env   = false
truncate   = true

[tools]
node        = "26.10.0"
helm        = "4.3.0"
kubectl     = "1.37.0"
kustomize   = "5.8.1"
kubeconform = "0.8.0"
kube-linter = "0.8.3"
helm-diff   = { version = "3.15.13", bin = "diff", bin_path = "diff/bin", rename_exe = "helm-diff", exe = "diff" }
trivy       = "0.74.0"
python      = "3.15.0b3"
shellcheck  = "0.11.0"
eza         = "0.23.5"
rg          = "15.2.0"
git-cliff   = "2.14.2"
prek        = "0.5.3"

[env]
_.python.venv = { path = ".venv", create = true } # create the venv if it doesn't exist

[tasks."helm:deps-update"]
description = "Update Helm chart dependencies"
run         = ".ci/helm-deps-update.sh"

[tasks.helm-deps-check]
run         = ".ci/check-helm-dependencies.sh"
description = "Verify committed Helm dependency archives match Chart.lock"

[tasks.helm-lint]
description = "Lint and render Helm charts (all, or the charts given as arguments)"
run         = ".ci/helm-lint.sh"

[tasks.test-shell]
run         = ".ci/test-shell.sh"
description = "Run shell script tests"

[tasks.kube-linter]
run         = "kube-linter lint .ci/rendered --config .kube-linter.yaml"
description = "Lint rendered Kubernetes manifests with the repository policy"

# Chart releases have independent versions and automated Forgejo tags.
[tasks.changelog]
description = "Show current chart commit history (CHANGELOG.md retains a historical snapshot)"
run = "git log --oneline --decorate -- charts/"

[tasks.markdown-lint]
description = "Lint Markdown files"
run         = "rumdl check ."

[tasks.markdown-fix]
description = "Fix Markdown files"
run         = "rumdl fmt ."

[tasks.hooks-install]
description = "Install prek hooks"
run         = "prek install -f"

[tasks.pre-commit-run]
description = "Run prek hooks"
run         = "prek run --all-files"
